{% extends "base.html" %}
{% block title %}신환 차트 – GuGu Medical Center EMR{% endblock %}

{% block content %}
<div class="container">
  <div class="button-group top-buttons">
    <a href="/dashboard" class="back-button">← 메인 대시보드</a>
  </div>

  <div id="custom-toast" class="toast hidden"></div>

  <div class="card">
    <h2>신환 차트</h2>
    <form id="basic-info-form">
      <input type="hidden" name="name" value="{{ name }}">
      <input type="hidden" name="birth_date" value="{{ birth_date }}">

      <!-- C.C. -->
      <div class="form-group">
        <label for="cc">C.C. (주호소)</label>
        <textarea id="cc" name="cc" rows="3">{{ chart.cc if chart and chart.cc is not none else '' }}</textarea>
      </div>

      <!-- P.I. -->
      <div class="form-group">
        <label for="pi">P.I. (병력)</label>
        <textarea id="pi" name="pi" rows="7">{{ chart.pi if chart and chart.pi is not none else '' }}</textarea>
      </div>

      <!-- ROS -->
      <div class="form-group">
        <label for="ros">ROS</label>
        <textarea id="ros" name="ros" rows="5">{{ chart.ros if chart and chart.ros is not none else '' }}</textarea>
      </div>

      <!-- History -->
      <fieldset class="section-fieldset">
        <legend>History</legend>
        <div class="form-group">
          <label for="pmhx">PMHx.</label>
          <textarea id="pmhx" name="pmhx" rows="2">{{ chart.pmhx if chart and chart.pmhx is not none else '' }}</textarea>
        </div>
        <div class="form-group">
          <label for="medication_hx">Medication Hx.</label>
          <textarea id="medication_hx" name="medication_hx" rows="2">{{ chart.medication_hx if chart and chart.medication_hx is not none else '' }}</textarea>
        </div>
        <div class="form-group">
          <label for="social">Social Hx.</label>
          <textarea id="social" name="social" rows="2">{{ chart.social if chart and chart.social is not none else '' }}</textarea>
        </div>
        <div class="form-group">
          <label for="fhx">FHx.</label>
          <textarea id="fhx" name="fhx" rows="2">{{ chart.fhx if chart and chart.fhx is not none else '' }}</textarea>
        </div>
        <div class="form-group">
          <label for="allergy_notes">Allergy</label>
          <textarea id="allergy_notes" name="allergy_notes" rows="2">{{ chart.allergy_notes if chart and chart.allergy_notes is not none else '' }}</textarea>
        </div>
      </fieldset>

      <!-- P/E -->
      <div class="form-group">
        <label for="pe">P/E</label>
        <textarea id="pe" name="pe" rows="3">{{ chart.pe if chart and chart.pe is not none else '' }}</textarea>
      </div>

      <!-- Problem list / Assessment -->
      <div class="form-group">
        <label for="problem_list">Problem list</label>
        <textarea id="problem_list" name="problem_list" rows="5">{{ chart.problem_list if chart and chart.problem_list is not none else '' }}</textarea>
      </div>
      <div class="form-group">
        <label for="assessment">Assessment</label>
        <textarea id="assessment" name="assessment" rows="5">{{ chart.assessment if chart and chart.assessment is not none else '' }}</textarea>
      </div>

      <!-- N/Ex. -->
      <fieldset class="section-fieldset">
        <legend>N/Ex.</legend>
        <table class="ne-table">
          <tr>
            <td>
              <label>
                <input type="radio" name="ne_cog" value="O"
                       {% if chart and chart.ne_cog %}checked{% endif %}>
                인지저하
              </label>
            </td>
            <td>
              MMSE
              <input type="text" name="mmse" style="width:50px;"
                     value="{{ chart.mmse if chart and chart.mmse is not none else '' }}">
              /30
            </td>
            <td>
              CDR
              <input type="text" name="cdr_score" style="width:50px;"
                     value="{{ chart.cdr_score if chart and chart.cdr_score is not none else '' }}">
            </td>
          </tr>
          <tr>
            <td>
              <label>
                <input type="radio" name="ne_sleep" value="O"
                       {% if chart and chart.ne_sleep %}checked{% endif %}>
                수면장애
              </label>
            </td>
            <td colspan="2">
              PSQI
              <input type="text" name="psqi" style="width:60px;"
                     value="{{ chart.psqi if chart and chart.psqi is not none else '' }}">
              or ISI
              <input type="text" name="isi" style="width:60px;"
                     value="{{ chart.isi if chart and chart.isi is not none else '' }}">
            </td>
          </tr>
          <tr>
            <td>
              <label>
                <input type="radio" name="ne_depress" value="O"
                       {% if chart and chart.ne_depress %}checked{% endif %}>
                우울감
              </label>
            </td>
            <td colspan="2">
              GDS
              <input type="text" name="gds" style="width:60px;"
                     value="{{ chart.gds if chart and chart.gds is not none else '' }}">
            </td>
          </tr>
        </table>
      </fieldset>

      <div class="button-group">
        <button type="submit" class="button" id="save-button">저장</button>
        <button type="button" class="button" onclick="history.back()">취소</button>
        <button type="button" class="button" id="back-button">뒤로가기</button>
      </div>
    </form>
  </div>
</div>
<script src="/static/js/new_emr.js"></script>
{% endblock %}
